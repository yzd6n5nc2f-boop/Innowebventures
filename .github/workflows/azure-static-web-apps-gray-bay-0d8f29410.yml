name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

jobs:
  build_job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build Validation Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Check sitemap generation
        run: npm run test:sitemap
      - name: Check public routes and 404 handling
        run: npm run test:routing
      - name: Check approved page metadata
        run: npm run test:metadata
      - name: Check full initial HTML
        run: npm run test:prerender

  build_and_deploy_job:
    needs: build_job
    if: needs.build_job.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build and verify deployment files
        run: |
          npm ci
          npm run build
          npm run test:routing
          npm run test:metadata
          npm run test:prerender
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_BAY_0D8F29410 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: "api"
          skip_app_build: true
          output_location: ""
          config_file_location: "dist"
          production_branch: "main"
      - name: Verify initial HTML on the live public site
        run: node scripts/verify-live-html.mjs
